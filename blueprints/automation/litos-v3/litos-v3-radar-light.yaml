blueprint:
  name: "Akamatis Litos v3 - radar and ambient-light lighting"
  description: >-
    Turn a light or switch on when Litos v3 detects presence and its ambient
    light reading is below the selected threshold (80 lx by default). Keep
    it on while presence is detected. Turn it off when the radar has reported
    no presence for the selected delay (30 seconds by default). Ambient light
    affects turn-on only.
  domain: automation
  author: Akamatis
  homeassistant:
    min_version: "2026.8.0"
  input:
    radar_presence:
      name: 'mmWave Radar — start typing "presence"'
      description: Select the radar presence entity on your Litos v3.
      selector:
        entity:
          filter:
            integration: esphome
            domain: binary_sensor
            device:
              manufacturer: Akamatis
    illuminance_sensor:
      name: 'Light Sensor — start typing "ambient light"'
      description: Select the VEML7700 ambient light entity on the same Litos v3, measured in lx.
      selector:
        entity:
          filter:
            integration: esphome
            domain: sensor
            device:
              manufacturer: Akamatis
    illuminance_threshold:
      name: Turn-on illuminance threshold
      description: Presence turns the light on only when illuminance is below this value.
      default: 80
      selector:
        number:
          min: 0
          max: 1000
          step: 1
          unit_of_measurement: lx
    light_target:
      name: Light or switch to control
      selector:
        target:
          entity:
            domain:
              - light
              - switch
    vacancy_delay:
      name: Empty-room delay
      description: Turn the light off after no radar presence is detected for this many seconds.
      default: 30
      selector:
        number:
          min: 0
          max: 1800
          step: 5
          unit_of_measurement: seconds

triggers:
  - trigger: state
    id: presence_detected
    entity_id: !input radar_presence
    to: "on"

  - trigger: state
    id: presence_clear
    entity_id: !input radar_presence
    to: "off"
    for:
      seconds: !input vacancy_delay

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: presence_detected
        sequence:
          - condition: numeric_state
            entity_id: !input illuminance_sensor
            below: !input illuminance_threshold
          - action: homeassistant.turn_on
            target: !input light_target
    default:
      - condition: state
        entity_id: !input radar_presence
        state: "off"
      - action: homeassistant.turn_off
        target: !input light_target

mode: restart
max_exceeded: silent
